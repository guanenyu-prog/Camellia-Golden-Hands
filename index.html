<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camellia Golden Hands Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #statusBadge { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.7); color: #0f0; padding: 8px 12px; border: 1px solid #0f0; border-radius: 4px; z-index: 100; font-size: 14px; }
        .waiting { color: #f90 !important; border-color: #f90 !important; }
        .active { color: #0f0 !important; border-color: #0f0 !important; }
    </style>
    <!-- Dependencies -->
    <script src="https://unpkg.com/three@0.133.0/build/three.js"></script>
    <script src="https://unpkg.com/three@0.133.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/three@0.133.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- VRM & Kalidokit -->
    <script src="https://unpkg.com/@pixiv/three-vrm@0.6.7/lib/three-vrm.js"></script>
    <script src="https://unpkg.com/kalidokit@1.1.5/dist/kalidokit.umd.js"></script>
</head>
<body>
    <div id="statusBadge" class="waiting">⏳ WAITING FOR WEBSOCKET DATA...</div>
    <script src="hand_simulator.js"></script>
</body>
</html>
